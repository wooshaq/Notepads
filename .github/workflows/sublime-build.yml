name: Build sideload package (Sublime features)

on:
  push:
    branches: [ sublime-features ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set package version (1.6.<run number>.0)
        shell: pwsh
        run: |
          $ver = "1.6.${{ github.run_number }}.0"
          $m = "src\Notepads\Package.appxmanifest"
          (Get-Content $m -Raw) -replace 'Version="1\.5\.6\.0"', "Version=""$ver""" | Set-Content $m -NoNewline -Encoding utf8
          Select-String -Path $m -Pattern '<Identity'
          "APP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Create self-signed test certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=wooshaq" `
            -KeyUsage DigitalSignature -FriendlyName "Notepads Sublime (test)" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "notepads" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\cert.pfx" -Password $pwd | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\Artifacts" | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\Artifacts\Notepads-Sublime-certyfikat.cer" | Out-Null

      - name: Restore
        shell: pwsh
        run: |
          msbuild src\Notepads.sln /t:Restore
          nuget restore src\Notepads.sln

      - name: Build x64 Production package (no DEV icons)
        shell: pwsh
        run: |
          msbuild src\Notepads.sln `
            /p:Platform=x64 `
            /p:Configuration=Production `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile=$env:CERT_FILE `
            /p:PackageCertificatePassword=notepads `
            /p:AppxPackageDir=$env:ARTIFACTS_DIR `
            /v:minimal
        env:
          CERT_FILE: ${{ github.workspace }}\cert.pfx
          ARTIFACTS_DIR: ${{ github.workspace }}\Artifacts\

      - name: Prepare files for Setup.exe
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path Artifacts -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw "No .msix produced" }
          New-Item -ItemType Directory -Force -Path pkg\Dependencies | Out-Null
          Copy-Item $msix.FullName pkg\Notepads.msix
          Copy-Item Artifacts\Notepads-Sublime-certyfikat.cer pkg\Notepads-Sublime.cer
          $deps = Join-Path $msix.DirectoryName "Dependencies\x64"
          if (Test-Path $deps) { Copy-Item "$deps\*.appx" pkg\Dependencies }
          Get-ChildItem -Recurse pkg | Select-Object FullName

      - name: Build Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyVersion=$env:APP_VERSION" build\installer\NotepadsSublime.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Notepads-Sublime-Setup
          path: Artifacts/Notepads-Sublime-Setup.exe

      - name: Upload raw MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: Notepads-Sublime-x64-msix
          path: Artifacts
